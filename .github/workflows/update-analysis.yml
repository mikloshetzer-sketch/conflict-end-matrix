name: Update Conflict Driver Analysis

on:
  workflow_dispatch:

  schedule:
    - cron: "25 4 * * *"

permissions:
  contents: write

jobs:
  update-analysis:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Generate Conflict Driver Analysis data
        run: |
          python src/generate_analysis_data.py

      - name: Verify generated analysis file
        run: |
          echo "Checking docs/analysis.json..."

          if [ ! -f docs/analysis.json ]; then
            echo "ERROR: docs/analysis.json was not generated."
            exit 1
          fi

          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("docs/analysis.json")

          with path.open("r", encoding="utf-8") as f:
              data = json.load(f)

          required = [
              "conflict_index",
              "assessment",
              "escalation_pressure",
              "diplomatic_pressure",
              "net_signal",
              "top_drivers",
              "categories",
              "key_signals",
          ]

          missing = [key for key in required if key not in data]

          if missing:
              raise SystemExit(
                  "ERROR: Missing fields in analysis.json: "
                  + ", ".join(missing)
              )

          print("analysis.json valid")
          print("Conflict index:", data.get("conflict_index"))
          print("Assessment:", data.get("assessment"))
          print("Escalation pressure:", data.get("escalation_pressure"))
          print("Diplomatic pressure:", data.get("diplomatic_pressure"))
          print("Net signal:", data.get("net_signal"))
          print("Drivers:", len(data.get("top_drivers", [])))
          print("Categories:", len(data.get("categories", [])))
          print("Signals:", len(data.get("key_signals", [])))
          PY

      - name: Commit analysis data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs/analysis.json

          if git diff --cached --quiet; then
            echo "No analysis changes to commit."
          else
            git commit -m "Update conflict driver analysis"
            git push
          fi
