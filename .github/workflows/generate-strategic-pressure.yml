name: Generate Strategic Pressure

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-strategic-pressure:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate historical event timeline
        run: python src/generate_event_timeline.py

      - name: Generate kinetic events
        run: python src/generate_kinetic_events.py

      - name: Generate strategic pressure
        run: python src/generate_strategic_pressure.py

      - name: Check generated files
        run: |
          test -f docs/strategic_pressure.json
          test -f docs/strategic_pressure_history.json

      - name: Commit generated strategic pressure files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs/event_timeline.json
          git add docs/event_direction_validation.json

          if [ -f docs/kinetic_events.json ]; then
            git add docs/kinetic_events.json
          fi

          if [ -f docs/event_timeline_kinetic.json ]; then
            git add docs/event_timeline_kinetic.json
          fi

          if [ -f docs/kinetic_event_timeline.json ]; then
            git add docs/kinetic_event_timeline.json
          fi

          git add docs/strategic_pressure.json
          git add docs/strategic_pressure_history.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update strategic pressure data"
            git push
          fi
