name: Generate Strategic Interest Achievement

on:
  # Kézi indítás továbbra is elérhető
  workflow_dispatch:

  # Automatikusan elindul a Strategic Pressure workflow után
  workflow_run:
    workflows:
      - "Generate Strategic Pressure"
    types:
      - completed

permissions:
  contents: write

concurrency:
  group: strategic-analysis-pipeline
  cancel-in-progress: false

jobs:
  generate-interest-achievement:
    name: Recalculate Interest Achievement
    runs-on: ubuntu-latest

    # Automatikus futásnál csak akkor induljon,
    # ha az előző workflow sikeresen befejeződött.
    # Kézi futtatásnál mindig elindulhat.
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      # =========================================================
      # 1. REPOSITORY
      # =========================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref_name }}

      # =========================================================
      # 2. UPDATE REPOSITORY STATE
      # =========================================================

      - name: Update checked-out branch
        shell: bash
        run: |
          set -euo pipefail

          BRANCH_NAME="${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref_name }}"

          if [ -z "$BRANCH_NAME" ]; then
            echo "::error::Could not determine the branch name."
            exit 1
          fi

          echo "Using branch: $BRANCH_NAME"

          git fetch origin "$BRANCH_NAME"
          git checkout "$BRANCH_NAME"
          git reset --hard "origin/$BRANCH_NAME"

      # =========================================================
      # 3. PYTHON
      # =========================================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      # =========================================================
      # 4. INPUT VALIDATION
      # =========================================================

      - name: Verify required files
        shell: bash
        run: |
          set -euo pipefail

          required_files=(
            "docs/strategic_pressure.json"
            "docs/strategic_pressure_history.json"
            "data/strategic/strategic_interests.json"
            "data/strategic/interest_impact_map.json"
            "src/generate_interest_achievement.py"
          )

          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "::error file=$file::Required file is missing: $file"
              exit 1
            fi

            echo "Found: $file"
          done

      # =========================================================
      # 5. INPUT STRUCTURE CHECK
      # =========================================================

      - name: Validate Strategic Pressure inputs
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          from pathlib import Path

          current_path = Path("docs/strategic_pressure.json")
          history_path = Path("docs/strategic_pressure_history.json")

          with current_path.open("r", encoding="utf-8") as file:
              current_data = json.load(file)

          with history_path.open("r", encoding="utf-8") as file:
              history_data = json.load(file)

          if not isinstance(current_data, dict):
              raise SystemExit(
                  "::error file=docs/strategic_pressure.json::"
                  "The Strategic Pressure current file is invalid."
              )

          if not isinstance(history_data, dict):
              raise SystemExit(
                  "::error file=docs/strategic_pressure_history.json::"
                  "The Strategic Pressure history file is invalid."
              )

          days = history_data.get("days")

          if not isinstance(days, list):
              raise SystemExit(
                  "::error file=docs/strategic_pressure_history.json::"
                  "The history file does not contain a valid days[] array."
              )

          if not days:
              raise SystemExit(
                  "::error file=docs/strategic_pressure_history.json::"
                  "The history days[] array is empty."
              )

          valid_dates = sorted(
              str(day.get("date", "")).strip()
              for day in days
              if isinstance(day, dict)
              and isinstance(day.get("date"), str)
              and day["date"].strip()
          )

          if not valid_dates:
              raise SystemExit(
                  "::error file=docs/strategic_pressure_history.json::"
                  "No valid dated records were found in days[]."
              )

          current_node = current_data.get(
              "current",
              current_data,
          )

          if not isinstance(current_node, dict):
              raise SystemExit(
                  "::error file=docs/strategic_pressure.json::"
                  "The current Strategic Pressure structure is invalid."
              )

          current_date = (
              current_node.get("date")
              or current_data.get("latest_complete_utc_day")
              or "unknown"
          )

          print("")
          print("Strategic Pressure input validation")
          print("-----------------------------------")
          print(f"Current reference date: {current_date}")
          print(f"History records: {len(days)}")
          print(f"History start: {valid_dates[0]}")
          print(f"History end: {valid_dates[-1]}")
          PY

      # =========================================================
      # 6. SCRIPT VALIDATION
      # =========================================================

      - name: Validate Python script
        shell: bash
        run: |
          set -euo pipefail

          python -m py_compile src/generate_interest_achievement.py

      # =========================================================
      # 7. FULL RECALCULATION
      # =========================================================

      - name: Generate full Interest Achievement dataset
        shell: bash
        run: |
          set -euo pipefail

          python src/generate_interest_achievement.py \
            --pressure docs/strategic_pressure.json \
            --pressure-history docs/strategic_pressure_history.json \
            --interests data/strategic/strategic_interests.json \
            --impact-map data/strategic/interest_impact_map.json \
            --output docs/interest_achievement.json

      # =========================================================
      # 8. OUTPUT VALIDATION
      # =========================================================

      - name: Validate generated Interest Achievement
        shell: bash
        run: |
          set -euo pipefail

          test -f docs/interest_achievement.json

          python - <<'PY'
          import json
          from pathlib import Path

          output_path = Path("docs/interest_achievement.json")

          with output_path.open("r", encoding="utf-8") as file:
              data = json.load(file)

          required_blocks = (
              "metadata",
              "current",
              "history",
              "history_summary",
              "diagnostics",
          )

          missing_blocks = [
              block
              for block in required_blocks
              if block not in data
          ]

          if missing_blocks:
              raise SystemExit(
                  "::error file=docs/interest_achievement.json::"
                  f"Missing required blocks: {', '.join(missing_blocks)}"
              )

          metadata = data.get("metadata", {})
          current = data.get("current", {})
          history = data.get("history")
          history_summary = data.get("history_summary", {})
          diagnostics = data.get("diagnostics", {})
          counts = diagnostics.get("counts", {})

          if not isinstance(current, dict):
              raise SystemExit(
                  "::error file=docs/interest_achievement.json::"
                  "The current block is invalid."
              )

          if not isinstance(history, list) or not history:
              raise SystemExit(
                  "::error file=docs/interest_achievement.json::"
                  "Generated history is empty or invalid."
              )

          actual_day_count = len(history)
          metadata_day_count = metadata.get("history_day_count")
          summary_day_count = history_summary.get("day_count")

          if metadata_day_count != actual_day_count:
              raise SystemExit(
                  "::error file=docs/interest_achievement.json::"
                  "metadata.history_day_count does not match "
                  "the generated history length."
              )

          if summary_day_count != actual_day_count:
              raise SystemExit(
                  "::error file=docs/interest_achievement.json::"
                  "history_summary.day_count does not match "
                  "the generated history length."
              )

          current_date = current.get("date")
          history_end_date = history[-1].get("date")

          if not current_date:
              raise SystemExit(
                  "::error file=docs/interest_achievement.json::"
                  "The current block has no valid date."
              )

          if current_date != history_end_date:
              print(
                  "::warning file=docs/interest_achievement.json::"
                  "Current date differs from the last history date."
              )

          print("")
          print("Interest Achievement generation completed")
          print("-----------------------------------------")
          print(f"Current date: {current_date}")
          print(
              "History range: "
              f"{metadata.get('history_start_date', 'unknown')} "
              "to "
              f"{metadata.get('history_end_date', 'unknown')}"
          )
          print(f"History days: {actual_day_count}")
          print(
              "Suppressed evidence: "
              f"{counts.get('suppressed_evidence', 0)}"
          )
          print(
              "Bilateral duplicates: "
              f"{counts.get('bilateral_duplicates', 0)}"
          )
          print(
              "Unmapped indicators: "
              f"{counts.get('unmapped_indicators', 0)}"
          )
          print(
              "Warnings: "
              f"{counts.get('warnings', 0)}"
          )
          PY

      # =========================================================
      # 9. GENERATED FILE INFORMATION
      # =========================================================

      - name: Show generated file information
        shell: bash
        run: |
          set -euo pipefail

          ls -lh docs/interest_achievement.json

      # =========================================================
      # 10. COMMIT
      # =========================================================

      - name: Commit generated file
        id: commit
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs/interest_achievement.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "Update Strategic Interest Achievement"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # =========================================================
      # 11. PUSH
      # =========================================================

      - name: Push changes
        if: steps.commit.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          BRANCH_NAME="${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref_name }}"

          git push origin "HEAD:$BRANCH_NAME"
