name: Update Event Timeline

on:
  workflow_dispatch:

  schedule:
    - cron: "30 4 * * *"

permissions:
  contents: write

jobs:
  update-event-timeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout full repository history
        uses: actions/checkout@v4
        with:
          # REQUIRED:
          # generate_event_timeline.py reconstructs historical
          # latest_scored.json versions from Git history.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Generate historical non-kinetic event timeline
        run: |
          python src/generate_event_timeline.py

      - name: Validate event timeline
        run: |
          if [ ! -f docs/event_timeline.json ]; then
            echo "ERROR: docs/event_timeline.json was not generated."
            exit 1
          fi

          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("docs/event_timeline.json")

          with path.open("r", encoding="utf-8") as f:
              data = json.load(f)

          events = data.get("events")

          if not isinstance(events, list):
              raise SystemExit("ERROR: 'events' must be a list")

          required_event_fields = {
              "event_id",
              "timestamp",
              "event_type",
              "subtype",
              "diplomatic_event",
              "military_event",
              "direction",
              "keywords",
          }

          for index, event in enumerate(events):
              missing = sorted(required_event_fields - set(event))
              if missing:
                  raise SystemExit(
                      f"ERROR: event {index} missing: {', '.join(missing)}"
                  )

              if event.get("military_event"):
                  raise SystemExit(
                      f"ERROR: event {index} contains military_event data. "
                      "This generator must stay non-kinetic."
                  )

          print("event_timeline.json valid")
          print("Historical versions:",
                data.get("historical_scored_versions_read"))
          print("Unique articles:",
                data.get("unique_articles_scanned"))
          print("Events:", len(events))
          print("Types:", data.get("event_type_counts"))
          PY

      - name: Commit event timeline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs/event_timeline.json

          if git diff --cached --quiet; then
            echo "No event timeline changes to commit."
          else
            git commit -m "Update historical diplomacy event timeline"
            git push
          fi
