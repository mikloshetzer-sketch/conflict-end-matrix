name: Update Event Timeline

on:
  workflow_dispatch:

  schedule:
    - cron: "30 4 * * *"

permissions:
  contents: write

jobs:
  update-event-timeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout full repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Generate historical non-kinetic timeline
        run: |
          python src/generate_event_timeline.py

      - name: Validate timeline and direction model
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          timeline_path = Path("docs/event_timeline.json")
          validation_path = Path("docs/event_direction_validation.json")

          for path in (timeline_path, validation_path):
              if not path.exists():
                  raise SystemExit(f"ERROR: missing {path}")

          with timeline_path.open("r", encoding="utf-8") as f:
              data = json.load(f)

          events = data.get("events")
          if not isinstance(events, list):
              raise SystemExit("ERROR: timeline 'events' must be a list")

          allowed_directions = {"escalation", "de-escalation", "mixed"}

          for i, event in enumerate(events):
              required = {
                  "event_id",
                  "timestamp",
                  "event_type",
                  "subtype",
                  "direction",
                  "direction_score",
                  "direction_reasons",
                  "diplomatic_event",
                  "military_event",
              }

              missing = sorted(required - set(event))
              if missing:
                  raise SystemExit(
                      f"ERROR: event {i} missing: {', '.join(missing)}"
                  )

              if event["direction"] not in allowed_directions:
                  raise SystemExit(
                      f"ERROR: invalid direction on event {i}: "
                      f"{event['direction']}"
                  )

              if event.get("military_event"):
                  raise SystemExit(
                      f"ERROR: event {i} contains military data"
                  )

          with validation_path.open("r", encoding="utf-8") as f:
              validation = json.load(f)

          print("event_timeline.json valid")
          print("Direction model:", data.get("direction_model"))
          print("Events:", len(events))
          print("Direction counts:", data.get("direction_counts"))
          print("Changed:", validation.get("changed_count"))
          print("Transitions:", validation.get("transition_counts"))

          print("\nManual-review examples:")
          for example in validation.get("review_examples", [])[:10]:
              print(
                  example.get("old_direction"),
                  "->",
                  example.get("new_direction"),
                  "|",
                  example.get("direction_score"),
                  "|",
                  example.get("title"),
              )
          PY

      - name: Commit timeline and validation report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            docs/event_timeline.json \
            docs/event_direction_validation.json

          if git diff --cached --quiet; then
            echo "No event timeline changes to commit."
          else
            git commit -m "Improve diplomatic direction classification"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
