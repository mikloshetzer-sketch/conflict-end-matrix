name: Update Event Timeline

on:
  workflow_dispatch:

  schedule:
    - cron: "30 4 * * *"

permissions:
  contents: write

jobs:
  update-event-timeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Generate non-kinetic event timeline
        run: |
          python src/generate_event_timeline.py

      - name: Validate event timeline
        run: |
          echo "Checking docs/event_timeline.json..."

          if [ ! -f docs/event_timeline.json ]; then
            echo "ERROR: docs/event_timeline.json was not generated."
            exit 1
          fi

          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("docs/event_timeline.json")

          with path.open("r", encoding="utf-8") as f:
              data = json.load(f)

          if "events" not in data:
              raise SystemExit("ERROR: 'events' key missing from event_timeline.json")

          if not isinstance(data["events"], list):
              raise SystemExit("ERROR: 'events' must be a list")

          for i, event in enumerate(data["events"]):
              required = [
                  "event_id",
                  "timestamp",
                  "event_type",
                  "subtype",
                  "diplomatic_event",
                  "military_event",
                  "direction",
                  "keywords",
              ]

              missing = [key for key in required if key not in event]

              if missing:
                  raise SystemExit(
                      f"ERROR: Event {i} missing fields: {', '.join(missing)}"
                  )

              if event.get("military_event"):
                  raise SystemExit(
                      f"ERROR: Event {i} contains military_event data. "
                      "This generator must remain non-kinetic only."
                  )

          print("event_timeline.json valid")
          print("Events:", len(data["events"]))
          print("Military events included:", data.get("military_events_included"))
          PY

      - name: Commit event timeline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs/event_timeline.json

          if git diff --cached --quiet; then
            echo "No event timeline changes to commit."
          else
            git commit -m "Update diplomacy and conflict event timeline"
            git push
          fi
