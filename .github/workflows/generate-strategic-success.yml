name: Generate Strategic Success

on:
  # Kézi indítás továbbra is elérhető
  workflow_dispatch:

  # Automatikus indítás az Interest Achievement után
  workflow_run:
    workflows:
      - "Generate Strategic Interest Achievement"
    types:
      - completed

permissions:
  contents: write

concurrency:
  group: strategic-analysis-pipeline
  cancel-in-progress: false

jobs:
  generate-strategic-success:
    name: Recalculate Strategic Success
    runs-on: ubuntu-latest

    # Automatikus futásnál csak sikeres előző workflow után induljon.
    # Kézi futtatásnál mindig elindulhat.
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      # =========================================================
      # 1. REPOSITORY
      # =========================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref_name }}

      # =========================================================
      # 2. UPDATE REPOSITORY STATE
      # =========================================================

      - name: Update checked-out branch
        shell: bash
        run: |
          set -euo pipefail

          BRANCH_NAME="${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref_name }}"

          if [ -z "$BRANCH_NAME" ]; then
            echo "::error::Could not determine the branch name."
            exit 1
          fi

          echo "Using branch: $BRANCH_NAME"

          git fetch origin "$BRANCH_NAME"
          git checkout "$BRANCH_NAME"
          git reset --hard "origin/$BRANCH_NAME"

      # =========================================================
      # 3. PYTHON
      # =========================================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      # =========================================================
      # 4. INPUT VALIDATION
      # =========================================================

      - name: Verify required files
        shell: bash
        run: |
          set -euo pipefail

          required_files=(
            "docs/interest_achievement.json"
            "src/generate_strategic_success.py"
          )

          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "::error file=$file::Required file is missing: $file"
              exit 1
            fi

            echo "Found: $file"
          done

      # =========================================================
      # 5. INPUT STRUCTURE CHECK
      # =========================================================

      - name: Validate Interest Achievement input
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          from pathlib import Path

          input_path = Path("docs/interest_achievement.json")

          with input_path.open("r", encoding="utf-8") as file:
              data = json.load(file)

          required_blocks = (
              "metadata",
              "current",
              "history",
              "history_summary",
              "diagnostics",
          )

          missing_blocks = [
              block
              for block in required_blocks
              if block not in data
          ]

          if missing_blocks:
              raise SystemExit(
                  "::error file=docs/interest_achievement.json::"
                  f"Missing required blocks: {', '.join(missing_blocks)}"
              )

          metadata = data.get("metadata", {})
          current = data.get("current")
          history = data.get("history")
          history_summary = data.get("history_summary", {})

          if not isinstance(current, dict):
              raise SystemExit(
                  "::error file=docs/interest_achievement.json::"
                  "The current block is invalid."
              )

          if not isinstance(history, list) or not history:
              raise SystemExit(
                  "::error file=docs/interest_achievement.json::"
                  "The history[] array is missing or empty."
              )

          current_date = current.get("date")
          first_date = history[0].get("date")
          last_date = history[-1].get("date")

          if not current_date:
              raise SystemExit(
                  "::error file=docs/interest_achievement.json::"
                  "The current block has no date."
              )

          if not first_date or not last_date:
              raise SystemExit(
                  "::error file=docs/interest_achievement.json::"
                  "The history contains records without valid dates."
              )

          actual_day_count = len(history)
          metadata_day_count = metadata.get("history_day_count")
          summary_day_count = history_summary.get("day_count")

          if metadata_day_count != actual_day_count:
              raise SystemExit(
                  "::error file=docs/interest_achievement.json::"
                  "metadata.history_day_count does not match "
                  "the actual history length."
              )

          if summary_day_count != actual_day_count:
              raise SystemExit(
                  "::error file=docs/interest_achievement.json::"
                  "history_summary.day_count does not match "
                  "the actual history length."
              )

          if current_date != last_date:
              print(
                  "::warning file=docs/interest_achievement.json::"
                  "Current date differs from the last history date."
              )

          print("")
          print("Interest Achievement input validation")
          print("-------------------------------------")
          print(f"Current date: {current_date}")
          print(f"History records: {actual_day_count}")
          print(f"History start: {first_date}")
          print(f"History end: {last_date}")
          print(
              "Model version: "
              f"{metadata.get('model_version', 'unknown')}"
          )
          PY

      # =========================================================
      # 6. SCRIPT VALIDATION
      # =========================================================

      - name: Validate Strategic Success script
        shell: bash
        run: |
          set -euo pipefail

          python -m py_compile src/generate_strategic_success.py

      # =========================================================
      # 7. GENERATION
      # =========================================================

      - name: Generate Strategic Success
        shell: bash
        run: |
          set -euo pipefail

          python src/generate_strategic_success.py \
            --input docs/interest_achievement.json \
            --output docs/strategic_success.json

      # =========================================================
      # 8. OUTPUT VALIDATION
      # =========================================================

      - name: Validate Strategic Success output
        shell: bash
        run: |
          set -euo pipefail

          test -f docs/strategic_success.json

          python - <<'PY'
          import json
          from pathlib import Path

          output_path = Path("docs/strategic_success.json")

          with output_path.open("r", encoding="utf-8") as file:
              data = json.load(file)

          required_blocks = (
              "metadata",
              "current",
              "history",
              "history_summary",
              "diagnostics",
              "methodology",
          )

          missing_blocks = [
              block
              for block in required_blocks
              if block not in data
          ]

          if missing_blocks:
              raise SystemExit(
                  "::error file=docs/strategic_success.json::"
                  f"Missing required blocks: {', '.join(missing_blocks)}"
              )

          metadata = data.get("metadata", {})
          current = data.get("current", {})
          history = data.get("history")
          history_summary = data.get("history_summary", {})
          diagnostics = data.get("diagnostics", {})
          counts = diagnostics.get("counts", {})
          methodology = data.get("methodology", {})

          if not isinstance(current, dict):
              raise SystemExit(
                  "::error file=docs/strategic_success.json::"
                  "The current block is invalid."
              )

          if not isinstance(history, list) or not history:
              raise SystemExit(
                  "::error file=docs/strategic_success.json::"
                  "Generated history[] is empty or invalid."
              )

          if not isinstance(methodology, dict):
              raise SystemExit(
                  "::error file=docs/strategic_success.json::"
                  "The methodology block is invalid."
              )

          actual_day_count = len(history)
          metadata_day_count = metadata.get("history_day_count")
          summary_day_count = history_summary.get("day_count")

          if metadata_day_count != actual_day_count:
              raise SystemExit(
                  "::error file=docs/strategic_success.json::"
                  "metadata.history_day_count does not match "
                  "the actual history length."
              )

          if summary_day_count != actual_day_count:
              raise SystemExit(
                  "::error file=docs/strategic_success.json::"
                  "history_summary.day_count does not match "
                  "the actual history length."
              )

          summary = current.get("summary")

          if not isinstance(summary, dict):
              raise SystemExit(
                  "::error file=docs/strategic_success.json::"
                  "current.summary is missing or invalid."
              )

          required_summary_fields = (
              "usa_success_index",
              "iran_success_index",
              "success_gap",
              "strategic_balance",
              "strategic_advantage",
              "interpretation_status",
              "is_provisional",
          )

          missing_summary_fields = [
              field
              for field in required_summary_fields
              if field not in summary
          ]

          if missing_summary_fields:
              raise SystemExit(
                  "::error file=docs/strategic_success.json::"
                  "Missing current summary fields: "
                  + ", ".join(missing_summary_fields)
              )

          data_maturity = current.get("data_maturity")

          if not isinstance(data_maturity, dict):
              raise SystemExit(
                  "::error file=docs/strategic_success.json::"
                  "current.data_maturity is missing or invalid."
              )

          required_maturity_fields = (
              "status",
              "observations",
              "full_maturity_observations",
              "confidence",
              "confidence_percent",
              "is_provisional",
          )

          missing_maturity_fields = [
              field
              for field in required_maturity_fields
              if field not in data_maturity
          ]

          if missing_maturity_fields:
              raise SystemExit(
                  "::error file=docs/strategic_success.json::"
                  "Missing current maturity fields: "
                  + ", ".join(missing_maturity_fields)
              )

          maturity_distribution = history_summary.get(
              "maturity_distribution"
          )

          if not isinstance(maturity_distribution, dict):
              raise SystemExit(
                  "::error file=docs/strategic_success.json::"
                  "history_summary.maturity_distribution "
                  "is missing or invalid."
              )

          maturity_total = sum(
              int(maturity_distribution.get(field, 0))
              for field in (
                  "insufficient_days",
                  "partial_days",
                  "full_days",
              )
          )

          if maturity_total != actual_day_count:
              raise SystemExit(
                  "::error file=docs/strategic_success.json::"
                  "The maturity distribution does not match "
                  "the actual history length."
              )

          history_end_date = history[-1].get("date")
          current_date = current.get("date")

          if current_date != history_end_date:
              print(
                  "::warning file=docs/strategic_success.json::"
                  "Current date differs from the last history date."
              )

          metadata_warning_count = metadata.get("warning_count")
          diagnostic_warning_count = counts.get("warnings")

          if (
              metadata_warning_count is not None
              and diagnostic_warning_count is not None
              and metadata_warning_count != diagnostic_warning_count
          ):
              raise SystemExit(
                  "::error file=docs/strategic_success.json::"
                  "metadata.warning_count does not match "
                  "diagnostics.counts.warnings."
              )

          print("")
          print("Strategic Success generation completed")
          print("--------------------------------------")
          print(f"Current date: {current_date}")
          print(
              "History range: "
              f"{metadata.get('history_start_date', 'unknown')} "
              "to "
              f"{metadata.get('history_end_date', 'unknown')}"
          )
          print(f"History days: {actual_day_count}")
          print(
              "Model version: "
              f"{metadata.get('model_version', 'unknown')}"
          )
          print(
              "Current maturity: "
              f"{data_maturity.get('status', 'unknown')}"
          )
          print(
              "Maturity confidence: "
              f"{data_maturity.get('confidence_percent', 'unknown')}%"
          )
          print(
              "Current provisional: "
              f"{data_maturity.get('is_provisional', 'unknown')}"
          )
          print(
              "USA Strategic Success: "
              f"{summary.get('usa_success_index')}"
          )
          print(
              "Iran Strategic Success: "
              f"{summary.get('iran_success_index')}"
          )
          print(
              "Success gap: "
              f"{summary.get('success_gap')}"
          )
          print(
              "Strategic balance: "
              f"{summary.get('strategic_balance')}"
          )
          print(
              "Strategic advantage: "
              f"{summary.get('strategic_advantage')}"
          )
          print(
              "Insufficient maturity days: "
              f"{maturity_distribution.get('insufficient_days', 0)}"
          )
          print(
              "Partial maturity days: "
              f"{maturity_distribution.get('partial_days', 0)}"
          )
          print(
              "Full maturity days: "
              f"{maturity_distribution.get('full_days', 0)}"
          )
          print(
              "Excluded history records: "
              f"{counts.get('excluded_history_records', 0)}"
          )
          print(
              "Warnings: "
              f"{counts.get('warnings', 0)}"
          )
          PY

      # =========================================================
      # 9. FILE INFORMATION
      # =========================================================

      - name: Show generated file information
        shell: bash
        run: |
          set -euo pipefail

          ls -lh docs/strategic_success.json

      # =========================================================
      # 10. COMMIT
      # =========================================================

      - name: Commit generated file
        id: commit
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs/strategic_success.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "Update Strategic Success"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # =========================================================
      # 11. PUSH
      # =========================================================

      - name: Push changes
        if: steps.commit.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          BRANCH_NAME="${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref_name }}"

          git push origin "HEAD:$BRANCH_NAME"
